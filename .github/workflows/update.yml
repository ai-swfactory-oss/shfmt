name: update

# Daily: move to the latest mvdan/sh release (upstream.json and every package
# version) and commit it. When there is nothing to bump and main has had no
# commit for 45 days, an empty keepalive commit keeps the repository active, so
# GitHub never disables the schedule. Then make sure every package of the
# current version is published; anything missing is built, tested and
# published, so a failed publish is retried every day until it succeeds.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    outputs:
      missing: ${{ steps.check.outputs.missing }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Move to the latest upstream release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/update.sh

      - name: Commit, or keep the repository active
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            scripts/check.sh
            git commit -am "chore: shfmt v$(jq -r .version upstream.json)"
            git push
          elif [ $(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 )) -ge 45 ]; then
            git commit --allow-empty -m "chore: keepalive"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@ai-swfactory-oss"

      - name: Is every package of this version published?
        id: check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source scripts/lib.sh
          v=$(package_version)
          missing=false
          for name in shfmt-linux-x64 shfmt-linux-arm64 shfmt-darwin-x64 shfmt-darwin-arm64 shfmt; do
            if npm view "@ai-swfactory-oss/$name@$v" version >/dev/null 2>&1; then
              echo "@ai-swfactory-oss/$name@$v published"
            else
              echo "@ai-swfactory-oss/$name@$v missing"; missing=true
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

  build:
    needs: update
    if: needs.update.outputs.missing == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
    secrets: inherit
